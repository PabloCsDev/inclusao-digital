services:
  db:
    image: postgres:16-alpine
    container_name: inclusao-digital-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inclusao_digital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d inclusao_digital"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: inclusao-digital-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/inclusao_digital
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
  frontend:
    image: node:22-alpine
    container_name: inclusao-digital-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "5173:5173"
volumes:
  postgres_data:
  frontend_node_modules:
